name: test_run
description: ""

# Global settings
random_seed: 42

# Cache
cache:
  raw_signals: true
  features: true

# Model
model:
  subject_dependent:
    type: random_forest
    params:
      n_estimators: 200
      max_depth: 5
      min_samples_leaf: 5
      n_jobs: -1

  subject_independent:
    type: random_forest
    params:
      n_estimators: 200
      max_depth: 10
      min_samples_leaf: 20
  

# Preprocessing
preprocessing:
  nan_handling: impute_median  # drop | impute_median | impute_zero
  subject_independent:
    normalization: per_subject_zscore  # per_subject_zscore | none 
  subject_dependent:
    normalization: none # ONLY none

# Datasets
datasets:
  biraffe:
    enabled: true
    window_time: 6
    threads: 9
    skip_subjects: []
  case:
    enabled: true
    window_time: 10
    threads: 2
    skip_subjects: []
  deap:
    enabled: true
    window_time: 60
    threads: 2
    skip_subjects: []

# Cross-validation
cv:
  subject_dependent:
    type: group_kfold
    n_splits: 5
  subject_independent:
    type: leave_one_group_out
